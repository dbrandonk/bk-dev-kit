---
# Settings shared by both services.
x-common: &common
  command: sleep infinity
  container_name: bk-dev-container
  image: bk-dev-docker:latest
  init: true
  network_mode: "host"
  shm_size: "8gb"
  volumes:
    - type: bind
      source: ~/.gitconfig
      target: /root/.gitconfig
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ~/.ssh
      target: /root/.ssh
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /tmp/.X11-unix
      target: /tmp/.X11-unix
      bind:
        create_host_path: true
    - type: bind
      source: ~/.config/opencode
      target: /root/.config/opencode
      bind:
        create_host_path: true

services:

  bk-developer:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      DISPLAY: ${DISPLAY}
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    runtime: nvidia

  bk-developer-no-gpu:
    <<: *common
    environment:
      DISPLAY: ${DISPLAY}
