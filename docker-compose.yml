---
# Settings shared by both services.
x-common: &common
  command: /bin/sh -c "while sleep 1000; do :; done"
  container_name: bk-dev-container
  image: bk-dev-docker:latest
  network_mode: "host"
  volumes:
    - /dev/shm:/dev/shm
    - ~/.gitconfig:/root/.gitconfig:ro
    - ~/.ssh:/root/.ssh:ro
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - type: bind
      source: ~/.config/opencode
      target: /root/.config/opencode
      bind:
        create_host_path: true

services:

  bk-developer:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      DISPLAY: ${DISPLAY}
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    runtime: nvidia

  bk-developer-no-gpu:
    <<: *common
    environment:
      DISPLAY: ${DISPLAY}
